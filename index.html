<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Deck</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div id="title">The Deck</div>
    <div id="subtitle">52 cards · 4 suits</div>

    <div id="deck-area"></div>
    <button id="shuffle-btn">Shuffle</button>
    <div id="status">Press shuffle to begin</div>

    <div id="draw-section">
      <div id="draw-label">How many cards will you draw?</div>
      <div id="draw-buttons">
        <button class="draw-btn" data-n="1">1</button>
        <button class="draw-btn" data-n="2">2</button>
        <button class="draw-btn" data-n="3">3</button>
      </div>
      <div id="drawn-area"></div>
      <button id="reset-btn">↺ Reset deck</button>
    </div>
  </div>

  <script src="deck.js"></script>
</body>
</html>
